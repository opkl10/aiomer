{% extends "base.html" %}

{% block title %}הרשמה - Aiomer AI{% endblock %}

{% block body %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h1>הרשמה</h1>
            <p>צור חשבון חדש</p>
        </div>

        <div class="alert-container"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">שם מלא</label>
                <input type="text" id="fullName" class="form-input"
                       placeholder="השם המלא שלך">
            </div>

            <div class="form-group">
                <label class="form-label">שם משתמש</label>
                <input type="text" id="username" class="form-input" required
                       placeholder="שם משתמש ייחודי" minlength="3">
            </div>

            <div class="form-group">
                <label class="form-label">אימייל</label>
                <input type="email" id="email" class="form-input" required
                       placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label class="form-label">סיסמה</label>
                <input type="password" id="password" class="form-input" required
                       placeholder="לפחות 6 תווים" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                הירשם
            </button>
        </form>

        <div class="auth-footer">
            כבר יש לך חשבון? <a href="/login">התחבר</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleRegister(e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    btn.innerHTML = '<div class="loading"></div>';

    try {
        await API.register(email, username, password, fullName);
        await API.login(email, password);
        window.location.href = '/chat';
    } catch (error) {
        showAlert(error.message);
        btn.disabled = false;
        btn.textContent = 'הירשם';
    }
}
</script>
{% endblock %}
